# Claude Code Discord Bot - Docker Compose Configuration
# Quick start: docker compose up -d
#
# Two deployment modes:
#
# 1. BASIC MODE (default): Bot talks to Claude via the SDK. No session-bridging.
#    Just set DISCORD_TOKEN + APPLICATION_ID + ANTHROPIC_API_KEY in .env.
#
# 2. SESSION-BRIDGING MODE: Bot mirrors host CLI sessions to Discord channels and
#    lets you continue them from Discord. Requires:
#      - Bind-mounting host's ~/.claude (for the watcher + claude --resume auth)
#      - Bind-mounting host's project directories (so claude --resume can cd to
#        the session's original cwd)
#      - CLAUDE_BINARY_PATH pointing at the in-container claude binary
#    Uncomment the SESSION-BRIDGING volumes and env vars below to enable.
#
# The session-bridging volumes give the container read-write access to the
# mounted host paths. Only enable this on a trusted host.

services:
  claude-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        # Match host user UID/GID so bind-mounted files have correct ownership.
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    # Option B: Use pre-built image from GHCR (uncomment and remove build above)
    # image: ghcr.io/zebbern/claude-code-discord:latest
    container_name: claude-code-discord
    restart: unless-stopped

    # Environment variables (use .env file or set here)
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APPLICATION_ID=${APPLICATION_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WORK_DIR=${WORK_DIR:-/app/workspace}
      - USER_ID=${USER_ID:-}
      - CATEGORY_NAME=${CATEGORY_NAME:-claude-code}
      - MONITOR_CHANNEL_ID=${MONITOR_CHANNEL_ID:-}
      - MONITOR_BOT_IDS=${MONITOR_BOT_IDS:-}
      # ── SESSION-BRIDGING MODE (uncomment to enable) ──
      # Path to the in-container claude binary (installed in Dockerfile).
      - CLAUDE_BINARY_PATH=/usr/bin/claude
      # Anthropic auth — for Ollama Cloud proxy, set these instead of ANTHROPIC_API_KEY:
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - CLAUDE_CODE_SUBAGENT_MODEL=${CLAUDE_CODE_SUBAGENT_MODEL:-}

    # Volume mounts for persistence and workspace access
    volumes:
      # Persist bot data (session-channel map, etc.)
      - bot-data:/app/.bot-data
      # Optional: Mount your local workspace for Claude to work on
      # Uncomment and modify path as needed:
      # - /path/to/your/project:/app/workspace
      # ── SESSION-BRIDGING MODE (uncomment to enable) ──
      # Mount host's ~/.claude so the watcher sees CLI sessions and claude --resume
      # has auth. Replace ${HOME} with your actual home path if Compose doesn't expand it.
      # - ${HOME}/.claude:/home/claude/.claude
      # Mount host's home directory (or specific project dirs) so `claude --resume`
      # can cd to a session's original cwd. WARNING: gives the container access to
      # everything under the mounted path. Mount only what you need.
      # - ${HOME}:${HOME}

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security options
    security_opt:
      - no-new-privileges:true

    # Network mode
    networks:
      - claude-network

# Named volumes for data persistence
volumes:
  bot-data:
    driver: local

# Network configuration
networks:
  claude-network:
    driver: bridge